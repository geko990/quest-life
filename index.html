<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>RPG Life</title>
  
  <!-- PWA Setup -->
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon.png">
  <link rel="icon" type="image/png" href="./icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- Barra di stato iOS "normale" (l'app inizia sotto di essa): con black-translucent iOS 26
       sfoca i contenuti che finiscono sotto la barra di stato. Scura o chiara in base al tema salvato. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black" id="statusBarStyle">
  <script>
    (function() {
      try {
        var st = JSON.parse(localStorage.getItem('questlife_state_v2') || '{}').settings || {};
        var light = st.themeMode === 'light' || (st.themeMode === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) || (!st.themeMode && (st.mode === 'light' || st.theme === 'light'));
        document.getElementById('statusBarStyle').setAttribute('content', light ? 'default' : 'black');
      } catch (e) {}
    })();
  </script>
  <meta name="theme-color" content="#0f0f1a">

  <!-- Emergency Auto-Recovery Script (Preserves localStorage user data) -->
  <script>
    (function() {
      window.onerror = function(msg, url, line) {
        console.error('[Emergency Recovery] Startup Error:', msg);
        var lastReload = localStorage.getItem('rpg_last_emergency_reload');
        var now = Date.now();
        if (!lastReload || (now - parseInt(lastReload, 10)) > 15000) {
          localStorage.setItem('rpg_last_emergency_reload', now.toString());
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              for (var i = 0; i < regs.length; i++) { regs[i].unregister(); }
            });
          }
          if ('caches' in window) {
            caches.keys().then(function(names) {
              for (var i = 0; i < names.length; i++) { caches.delete(names[i]); }
            });
          }
          setTimeout(function() {
            var search = window.location.search || '?';
            window.location.href = window.location.pathname + search + '&v=' + Date.now();
          }, 300);
        }
      };
    })();
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=Orbitron:wght@400;700&family=Outfit:wght@300;400;500;600;700&family=Patrick+Hand&display=swap" rel="stylesheet">
</head>
<body class="min-h-screen">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
