  <!-- Emergency Auto-Recovery Script (Preserves localStorage user data) -->
  <script>
    (function() {
      window.onerror = function(msg, url, line) {
        console.error('[Emergency Recovery] Startup Error:', msg);
        var lastReload = localStorage.getItem('rpg_last_emergency_reload');
        var now = Date.now();
        if (!lastReload || (now - parseInt(lastReload, 10)) > 15000) {
          localStorage.setItem('rpg_last_emergency_reload', now.toString());
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              for (var i = 0; i < regs.length; i++) { regs[i].unregister(); }
            });
          }
          if ('caches' in window) {
            caches.keys().then(function(names) {
              for (var i = 0; i < names.length; i++) { caches.delete(names[i]); }
            });
          }
          setTimeout(function() {
            var search = window.location.search || '?';
            window.location.href = window.location.pathname + search + '&v=' + Date.now();
          }, 300);
        }
      };
    })();
  </script>

  <!-- Apertura animata (#41). Deve stare qui e non in React: compare prima che l'app sia partita.
       Tutte le animazioni usano solo transform e opacity: così iOS le fa girare anche mentre l'app
       si sta avviando e tiene occupato il telefono (l'anello è fatto di due mezzi dischi che ruotano).
       Tempi: anello che si riempie finché l'app non è pronta (max 88%), poi si completa in 0,2 s,
       lampo dorato e uscita in 0,34 s. Se l'app è pronta entro 0,5 s si dissolve e basta.
       Riapertura entro 10 minuti, Animazioni spente o "Riduci movimento": immagine ferma, nessuna animazione.
       Colore di sfondo: quello del tema dell'app (salvato da App.jsx in ql_boot_bg), notte se manca. -->
  <style>
    html, body { background: #0f0f1a; }
    #ql-boot {
      --u: min(1vw, 0.6vh);
      --qb-bg: #0f0f1a;
      --qb-track: rgba(167, 139, 250, 0.14);
      --qb-word: #d9d2ff;
      position: fixed; inset: 0; z-index: 2147483000;
      background: var(--qb-bg);
      display: flex; align-items: center; justify-content: center;
      -webkit-user-select: none; user-select: none;
    }
    #ql-boot.qb-light { --qb-track: rgba(124, 58, 237, 0.16); --qb-word: #3b2a6b; }
    #ql-boot .qb-stack { display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * 7); transform: translateY(calc(var(--u) * -2)); }
    #ql-boot .qb-emblem { position: relative; width: calc(var(--u) * 44); height: calc(var(--u) * 44); }
    #ql-boot .qb-track { position: absolute; inset: 0; width: 100%; height: 100%; }
    #ql-boot .qb-track circle { fill: none; stroke: var(--qb-track); stroke-width: 3.2; }
    /* anello che si riempie: due metà ritagliate, ognuna con un mezzo disco colorato che ruota */
    #ql-boot .qb-ring { position: absolute; inset: 1.4%; border-radius: 50%; }
    #ql-boot .qb-half { position: absolute; top: 0; bottom: 0; width: 50%; overflow: hidden; }
    #ql-boot .qb-half.r { left: 50%; }
    #ql-boot .qb-half.l { left: 0; }
    #ql-boot .qb-disc { position: absolute; top: 0; width: 200%; height: 100%; border-radius: 50%; will-change: transform; }
    #ql-boot .qb-half.r .qb-disc { left: -100%; animation: qbRight 3.2s linear 0.1s both; }
    #ql-boot .qb-half.l .qb-disc { left: 0; animation: qbLeft 3.2s linear 0.1s both; }
    #ql-boot .qb-disc::before { content: ''; position: absolute; top: 0; bottom: 0; width: 50%; }
    #ql-boot .qb-half.r .qb-disc::before { left: 0; border-radius: 100% 0 0 100% / 50% 0 0 50%; background: linear-gradient(to top, #7c3aed, #a78bfa); }
    #ql-boot .qb-half.l .qb-disc::before { left: 50%; border-radius: 0 100% 100% 0 / 0 50% 50% 0; background: linear-gradient(to bottom, #a78bfa, #f59e0b); }
    #ql-boot .qb-hole { position: absolute; inset: 3.29%; border-radius: 50%; background: var(--qb-bg); }
    #ql-boot .qb-glow { position: absolute; inset: 8%; border-radius: 50%; background: radial-gradient(circle, rgba(124, 58, 237, 0.55), rgba(124, 58, 237, 0) 68%); opacity: 0.45; will-change: transform, opacity; animation: qbGlow 1.8s ease-in-out infinite; }
    #ql-boot .qb-tile { position: absolute; inset: 8%; border-radius: 50%; overflow: hidden; isolation: isolate; box-shadow: inset 0 0 0 1px rgba(167, 139, 250, 0.14), 0 10px 28px rgba(0, 0, 0, 0.45); }
    #ql-boot .qb-tile img { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -1; }
    #ql-boot .qb-tile::after { content: ''; position: absolute; top: -30%; bottom: -30%; left: 0; width: 38%; background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.38), transparent); transform: translateX(-190%) skewX(-18deg); will-change: transform; animation: qbShine 2.2s ease-in-out 0.35s infinite; }
    #ql-boot .qb-word { font-family: 'Cinzel', 'Trajan Pro', Georgia, serif; font-weight: 700; font-size: calc(var(--u) * 5.4); line-height: 1; letter-spacing: 0.32em; padding-left: 0.32em; color: var(--qb-word); opacity: 0; will-change: opacity; animation: qbWord 0.6s ease-out 0.25s forwards; }
    @keyframes qbGlow { 0%, 100% { opacity: 0.45; transform: scale(0.92); } 50% { opacity: 1; transform: scale(1.06); } }
    @keyframes qbRight { 0.0% { transform: rotate(0.0deg); } 2.5% { transform: rotate(36.7deg); } 5.0% { transform: rotate(69.1deg); } 7.81% { transform: rotate(101.2deg); } 10.94% { transform: rotate(131.9deg); } 14.06% { transform: rotate(158.3deg); } 17.06% { transform: rotate(180.0deg); } 20.31% { transform: rotate(180.0deg); } 25.0% { transform: rotate(180.0deg); } 31.25% { transform: rotate(180.0deg); } 39.06% { transform: rotate(180.0deg); } 48.44% { transform: rotate(180.0deg); } 59.38% { transform: rotate(180.0deg); } 75.0% { transform: rotate(180.0deg); } 100.0% { transform: rotate(180.0deg); } }
    @keyframes qbLeft { 0.0% { transform: rotate(0.0deg); } 2.5% { transform: rotate(0.0deg); } 5.0% { transform: rotate(0.0deg); } 7.81% { transform: rotate(0.0deg); } 10.94% { transform: rotate(0.0deg); } 14.06% { transform: rotate(0.0deg); } 17.06% { transform: rotate(0.0deg); } 20.31% { transform: rotate(20.3deg); } 25.0% { transform: rotate(44.3deg); } 31.25% { transform: rotate(68.8deg); } 39.06% { transform: rotate(90.5deg); } 48.44% { transform: rotate(107.6deg); } 59.38% { transform: rotate(119.8deg); } 75.0% { transform: rotate(128.9deg); } 100.0% { transform: rotate(134.5deg); } }
    @keyframes qbShine { 0% { transform: translateX(-190%) skewX(-18deg); } 55%, 100% { transform: translateX(370%) skewX(-18deg); } }
    @keyframes qbWord { to { opacity: 1; } }
    #ql-boot.qb-done .qb-disc { animation: none; transition: transform 0.2s ease-out; transform: rotate(180deg) !important; }
    #ql-boot.qb-done .qb-ring { animation: qbRingFlash 0.3s ease-out both; }
    #ql-boot.qb-done .qb-glow { background: radial-gradient(circle, rgba(245, 158, 11, 0.55), rgba(245, 158, 11, 0) 70%); opacity: 1; animation: none; }
    @keyframes qbRingFlash { 50% { transform: scale(1.07); } 100% { transform: scale(1.02); } }
    #ql-boot.qb-exit { animation: qbOut 0.34s ease-in forwards; pointer-events: none; }
    #ql-boot.qb-exit .qb-emblem { animation: qbEmblemOut 0.34s cubic-bezier(0.5, 0, 0.75, 0) forwards; }
    @keyframes qbOut { 0%, 30% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes qbEmblemOut { to { transform: scale(1.18); opacity: 0; } }
    /* Immagine ferma (riapertura ravvicinata, Animazioni spente, Riduci movimento) */
    #ql-boot.qb-quiet .qb-glow, #ql-boot.qb-quiet .qb-ring, #ql-boot.qb-quiet .qb-tile::after { display: none; }
    #ql-boot.qb-quiet .qb-word { animation: none; opacity: 0; }
    #ql-boot.qb-quiet.qb-exit, #ql-boot.qb-quiet.qb-exit .qb-emblem { animation: qbQuietOut 0.18s ease-out forwards; }
    @keyframes qbQuietOut { to { opacity: 0; } }
  </style>
</head>

      var quiet = false;
      try {
        var bg = localStorage.getItem('ql_boot_bg');
        if (bg && /^(#|rgb)/.test(bg)) {
          boot.style.setProperty('--qb-bg', bg);
          document.documentElement.style.background = bg;
          if (localStorage.getItem('ql_boot_mode') === 'light') boot.classList.add('qb-light');
        }
        var lastSeen = parseInt(localStorage.getItem('ql_last_seen') || '0', 10);
        if (lastSeen && Date.now() - lastSeen < QUIET_WINDOW) quiet = true;
        if (localStorage.getItem('ql_anim') === 'off') quiet = true;
      } catch (e) {}
      try { if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) quiet = true; } catch (e) {}
      if (quiet) boot.classList.add('qb-quiet');

      var markSeen = function () { try { localStorage.setItem('ql_last_seen', String(Date.now())); } catch (e) {} };
      document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') markSeen(); });
      window.addEventListener('pagehide', markSeen);

      var finished = false;
      // Chiamata dall'app quando la Home è disegnata (App.jsx) o dall'error boundary
      window.__qlBootDone = function () {
        if (finished || !boot) return;
        finished = true;
        var elapsed = (window.performance && performance.now) ? performance.now() : 1000;
        var exit = function () {
          boot.classList.add('qb-exit');
          try { window.dispatchEvent(new Event('ql-boot-exit')); } catch (e) {}
          setTimeout(function () { if (boot && boot.parentNode) boot.parentNode.removeChild(boot); boot = null; }, quiet ? 200 : 360);
        };
        if (quiet || elapsed < 500) { exit(); return; }
        // ferma l'anello dov'è e lo completa
        try {
          var discs = boot.querySelectorAll('.qb-disc');
          for (var i = 0; i < discs.length; i++) discs[i].style.transform = getComputedStyle(discs[i]).transform;
          void boot.offsetWidth;
        } catch (e) {}
        boot.classList.add('qb-done');
        setTimeout(exit, 220);
      };
      // Rete di sicurezza: se l'app non risponde, l'apertura non resta mai sopra lo schermo
      setTimeout(function () { window.__qlBootDone(); }, 8000);
    })();
  </script>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
