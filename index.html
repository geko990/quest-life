  <!-- Emergency Auto-Recovery Script (Preserves localStorage user data) -->
  <!-- Recupero da versione vecchia: se la pagina salvata dal service worker è di una versione precedente
       e i suoi file non ci sono più sul sito (dopo una pubblicazione), il codice dell'app non si carica
       ("Importing a module script failed" / "Script error."). Allora si tolgono service worker e copie
       salvate e si ricarica una volta la pagina dalla rete. I dati (localStorage) restano intatti.
       __qlRecover è usata anche da src/main.jsx quando il caricamento dell'app fallisce. -->
  <script>
    (function() {
      window.__qlRecover = function (reason) {
        console.error('[Emergency Recovery] Startup Error:', reason);
        var lastReload = 0;
        try { lastReload = parseInt(localStorage.getItem('rpg_last_emergency_reload') || '0', 10) || 0; } catch (e) {}
        var now = Date.now();
        if (now - lastReload <= 15000) return false; // già provato da poco: niente ricariche a catena
        try { localStorage.setItem('rpg_last_emergency_reload', now.toString()); } catch (e) {}
        var jobs = [];
        if ('serviceWorker' in navigator) {
          jobs.push(navigator.serviceWorker.getRegistrations().then(function(regs) {
            return Promise.all(regs.map(function (r) { return r.unregister(); }));
          }).catch(function () {}));
        }
        if ('caches' in window) {
          jobs.push(caches.keys().then(function(names) {
            return Promise.all(names.map(function (n) { return caches.delete(n); }));
          }).catch(function () {}));
        }
        var go = function () {
          var search = window.location.search || '?';
          window.location.href = window.location.pathname + search + '&v=' + Date.now();
        };
        // si ricarica quando la pulizia è finita (al massimo dopo 1,5 s)
        Promise.race([Promise.all(jobs), new Promise(function (r) { setTimeout(r, 1500); })]).then(go, go);
        return true;
      };
      window.onerror = function(msg) { window.__qlRecover(msg); };
    })();
  </script>

  <!-- Apertura animata (#41). Deve stare qui e non in React: compare prima che l'app sia partita.
       Mentre l'app si avvia: medaglione con alone che respira, riflesso e scritta (solo transform/opacity,
       che iOS fa girare anche quando il telefono è occupato ad avviare l'app). Quando la Home è pronta
       l'anello si riempie (0,5 s, 0,38 s se l'avvio è stato lungo), lampo dorato (0,15 s) e uscita (0,34 s).
       Durata minima di tutta la sequenza: 1,2 s (scelta dell'utente, solo all'avvio a freddo).
       Animazioni spente o "Riduci movimento": immagine ferma, nessuna animazione.
       Colori fissi del marchio (sfondo notte), uguali all'immagine di avvio di iOS: così dal tocco
       sull'icona all'animazione non c'è nessuno stacco, qualunque sia il tema dell'app. -->
  <style>
    html, body { background: #0f0f1a; }
    #ql-boot {
      --u: min(1vw, 0.6vh);
      --qb-bg: #0f0f1a;
      --qb-track: rgba(167, 139, 250, 0.14);
      --qb-word: #d9d2ff;
      position: fixed; inset: 0; z-index: 2147483000;
      background: var(--qb-bg);
      display: flex; align-items: center; justify-content: center;
      -webkit-user-select: none; user-select: none;
    }
    #ql-boot .qb-stack { display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * 7); transform: translateY(calc(var(--u) * -2)); }
    #ql-boot.qb-screen .qb-stack { position: absolute; left: 0; right: 0; top: var(--qb-top); transform: none; }
    #ql-boot .qb-emblem { position: relative; width: calc(var(--u) * 44); height: calc(var(--u) * 44); }
    #ql-boot .qb-track { position: absolute; inset: 0; width: 100%; height: 100%; }
    #ql-boot .qb-track circle { fill: none; stroke: var(--qb-track); stroke-width: 3.2; }
    /* anello che si riempie come una barra XP, quando la Home è pronta */
    #ql-boot .qb-ring { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
    #ql-boot .qb-bar { fill: none; stroke: url(#qbGrad); stroke-width: 3.2; stroke-linecap: round; stroke-dasharray: 295.3; stroke-dashoffset: 295.3; opacity: 0; }
    #ql-boot.qb-filling .qb-bar { opacity: 1; stroke-dashoffset: 0; transition: stroke-dashoffset var(--qb-fill, 500ms) cubic-bezier(0.35, 0.1, 0.25, 1); }
    #ql-boot .qb-glow { position: absolute; inset: 8%; border-radius: 50%; background: radial-gradient(circle, rgba(124, 58, 237, 0.55), rgba(124, 58, 237, 0) 68%); opacity: 0.45; will-change: transform, opacity; animation: qbGlow 1.8s ease-in-out infinite; }
    #ql-boot .qb-tile { position: absolute; inset: 8%; border-radius: 50%; overflow: hidden; isolation: isolate; box-shadow: inset 0 0 0 1px rgba(167, 139, 250, 0.14), 0 10px 28px rgba(0, 0, 0, 0.45); }
    #ql-boot .qb-tile img { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -1; }
    #ql-boot .qb-tile::after { content: ''; position: absolute; top: -30%; bottom: -30%; left: 0; width: 38%; background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.38), transparent); transform: translateX(-190%) skewX(-18deg); will-change: transform; animation: qbShine 2.2s ease-in-out 0.35s infinite; }
    #ql-boot .qb-word { font-family: 'Cinzel', 'Trajan Pro', Georgia, serif; font-weight: 700; font-size: calc(var(--u) * 5.4); line-height: 1; letter-spacing: 0.32em; padding-left: 0.32em; color: var(--qb-word); opacity: 0; will-change: opacity; animation: qbWord 0.6s ease-out 0.25s forwards; }
    @keyframes qbGlow { 0%, 100% { opacity: 0.45; transform: scale(0.92); } 50% { opacity: 1; transform: scale(1.06); } }
    @keyframes qbShine { 0% { transform: translateX(-190%) skewX(-18deg); } 55%, 100% { transform: translateX(370%) skewX(-18deg); } }
    @keyframes qbWord { to { opacity: 1; } }
    #ql-boot.qb-done .qb-ring { animation: qbRingFlash 0.3s ease-out both; }
    #ql-boot.qb-done .qb-glow { background: radial-gradient(circle, rgba(245, 158, 11, 0.55), rgba(245, 158, 11, 0) 70%); opacity: 1; animation: none; }
    @keyframes qbRingFlash { 50% { transform: rotate(-90deg) scale(1.07); } 100% { transform: rotate(-90deg) scale(1.02); } }
    #ql-boot.qb-exit { animation: qbOut 0.34s ease-in forwards; pointer-events: none; }
    #ql-boot.qb-exit .qb-emblem { animation: qbEmblemOut 0.34s cubic-bezier(0.5, 0, 0.75, 0) forwards; }
    @keyframes qbOut { 0%, 30% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes qbEmblemOut { to { transform: scale(1.18); opacity: 0; } }
    /* Immagine ferma (riapertura ravvicinata, Animazioni spente, Riduci movimento) */
    #ql-boot.qb-quiet .qb-glow, #ql-boot.qb-quiet .qb-ring, #ql-boot.qb-quiet .qb-tile::after { display: none; }
    #ql-boot.qb-quiet .qb-word { animation: none; opacity: 0; }
    #ql-boot.qb-quiet.qb-exit, #ql-boot.qb-quiet.qb-exit .qb-emblem { animation: qbQuietOut 0.18s ease-out forwards; }
    @keyframes qbQuietOut { to { opacity: 0; } }
  </style>

  <script>
    (function () {
      var boot = document.getElementById('ql-boot');
      // Ogni avvio a freddo mostra l'apertura (se l'app è ancora aperta in memoria iOS la riprende
      // senza ricaricarla, quindi non c'è apertura). Ferma solo con Animazioni spente o "Riduci movimento".
      var quiet = false;
      try { if (localStorage.getItem('ql_anim') === 'off') quiet = true; } catch (e) {}
      try { if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) quiet = true; } catch (e) {}
      if (quiet) boot.classList.add('qb-quiet');

      // Nell'app installata lo scudo si posiziona con le misure dello SCHERMO, le stesse usate per
      // l'immagine di avvio di iOS: così dall'immagine ferma all'animazione non c'è nessun salto
      // (con le misure della finestra c'era un piccolo spostamento).
      try {
        var standalone = window.navigator.standalone === true ||
          (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
        if (standalone && window.screen && screen.width) {
          var sw = Math.min(screen.width, screen.height), sh = Math.max(screen.width, screen.height);
          if (window.innerWidth <= window.innerHeight) { // in verticale, come l'immagine di iOS
            var u = Math.min(sw / 100, 0.6 * sh / 100);
            boot.style.setProperty('--u', u + 'px');
            boot.style.setProperty('--qb-top', (sh / 2 - 30.2 * u) + 'px');
            boot.classList.add('qb-screen');
          }
        }
      } catch (e) {}

      var finished = false;
      var shownAt = (window.performance && performance.now) ? performance.now() : 0; // quando compare l'apertura
      var MIN_TOTAL = 1200; // durata minima della sequenza (fino alla fine dell'uscita)
      var EXIT_MS = 340, FLASH_MS = 150;
      // Chiamata dall'app quando la Home è disegnata (App.jsx) o dall'error boundary
      window.__qlBootDone = function () {
        if (finished || !boot) return;
        finished = true;
        var exit = function () {
          boot.classList.add('qb-exit');
          try { window.dispatchEvent(new Event('ql-boot-exit')); } catch (e) {}
          setTimeout(function () { if (boot && boot.parentNode) boot.parentNode.removeChild(boot); boot = null; }, quiet ? 200 : EXIT_MS + 20);
        };
        if (quiet) { exit(); return; }
        var now = (window.performance && performance.now) ? performance.now() : shownAt + 1000;
        var elapsed = now - shownAt;
        var fill = elapsed > 900 ? 380 : 500;
        var wait = Math.max(0, MIN_TOTAL - (elapsed + fill + FLASH_MS + EXIT_MS));
        setTimeout(function () {
          if (!boot) return;
          boot.style.setProperty('--qb-fill', fill + 'ms');
          void boot.offsetWidth;
          boot.classList.add('qb-filling');
          setTimeout(function () {
            if (!boot) return;
            boot.classList.add('qb-done');
            setTimeout(exit, FLASH_MS);
          }, fill);
        }, wait);
      };
      // Rete di sicurezza: se l'app non risponde, l'apertura non resta mai sopra lo schermo
      setTimeout(function () { window.__qlBootDone(); }, 8000);
    })();
  </script>
  <script>
    // Immagine di avvio di iOS su misura per questo schermo (#41).
    // iOS mostra un'immagine ferma dal tocco sull'icona finché la pagina non compare, ma solo se ne trova
    // una della misura esatta dello schermo (con lo "Zoom schermo" le misure cambiano). Qui la disegniamo
    // al volo, identica al primo fotogramma dell'apertura, e la offriamo a iOS: la legge quando si fa
    // "Aggiungi alla schermata Home" da Safari. Le immagini fisse in splash/ restano come riserva.
    (function () {
      var standalone = window.navigator.standalone === true ||
        (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
      if (standalone) return; // dentro l'app installata non serve
      var img = document.querySelector('#ql-boot .qb-tile img');
      var src = img && img.src;
      if (!src) return;
      var make = function () {
        try {
          var dpr = window.devicePixelRatio || 1;
          var sw = Math.min(screen.width, screen.height), sh = Math.max(screen.width, screen.height);
          var W = Math.round(sw * dpr), H = Math.round(sh * dpr);
          var c = document.createElement('canvas'); c.width = W; c.height = H;
          var g = c.getContext('2d');
          var icon = new Image();
          icon.onload = function () {
            // stessa geometria di #ql-boot: --u = min(1vw, 0.6vh)
            var u = Math.min(W / 100, 0.6 * H / 100);
            var E = 44 * u, cx = W / 2;
            var cy = H / 2 - 2 * u - (E + 7 * u + 5.4 * u) / 2 + E / 2;
            g.fillStyle = '#0f0f1a'; g.fillRect(0, 0, W, H);
            g.beginPath(); g.arc(cx, cy, 0.47 * E, 0, Math.PI * 2);
            g.lineWidth = 0.032 * E; g.strokeStyle = 'rgba(167, 139, 250, 0.14)'; g.stroke();
            var r = 0.42 * E;
            g.save();
            g.shadowColor = 'rgba(0, 0, 0, 0.45)'; g.shadowBlur = 28 * dpr; g.shadowOffsetY = 10 * dpr;
            g.beginPath(); g.arc(cx, cy, r, 0, Math.PI * 2); g.fillStyle = '#0a0915'; g.fill();
            g.restore();
            g.save(); g.beginPath(); g.arc(cx, cy, r, 0, Math.PI * 2); g.clip();
            g.drawImage(icon, cx - r, cy - r, 2 * r, 2 * r); g.restore();
            g.beginPath(); g.arc(cx, cy, r - dpr / 2, 0, Math.PI * 2);
            g.lineWidth = dpr; g.strokeStyle = 'rgba(167, 139, 250, 0.14)'; g.stroke();
            var link = document.createElement('link');
            link.rel = 'apple-touch-startup-image';
            link.href = c.toDataURL('image/png');
            document.head.appendChild(link);
          };
          icon.src = src;
        } catch (e) {}
      };
      // dopo l'avvio, quando il telefono è libero
      window.addEventListener('load', function () { setTimeout(make, 1500); });
    })();
  </script>
