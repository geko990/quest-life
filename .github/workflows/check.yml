name: Verifica build

# Controlla che il progetto compili per ogni pull request e per i rami di lavoro,
# senza pubblicare nulla. La pubblicazione avviene solo da main (deploy.yml).
on:
  pull_request:
  push:
    branches-ignore: ['main']
  workflow_dispatch:

permissions:
  contents: write  # solo per salvare gli screenshot nel ramo ci-screenshots

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Traduzioni inglesi complete
        run: node scripts/check-i18n.mjs

      - name: Test di fumo nel browser
        run: |
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium
          npx vite preview --port 4173 --strictPort &
          npx --yes wait-on http://localhost:4173/ --timeout 30000
          node scripts/smoke-test.mjs

      - name: Salva screenshot nel ramo ci-screenshots
        if: always() && github.ref_name != 'main'
        run: |
          [ -d ci-shots ] || exit 0
          cd ci-shots
          echo "Ramo: ${GITHUB_REF_NAME} — commit ${GITHUB_SHA::7}" > INFO.txt
          git init -q && git checkout -q -b shots
          git add . && git -c user.name=ci -c user.email=ci@localhost commit -qm "screenshot ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" shots:ci-screenshots

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
