name: Verifica build

# Controlla che il progetto compili per ogni pull request e per i rami di lavoro,
# senza pubblicare nulla. La pubblicazione avviene solo da main (deploy.yml).
on:
  pull_request:
  push:
    branches-ignore: ['main']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
